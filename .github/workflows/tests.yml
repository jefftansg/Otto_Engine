name: Python tests

on:
  pull_request:
    branches: [main, 'development/**']
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 binaries are unavailable on the moving ubuntu-latest image.
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-15
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
